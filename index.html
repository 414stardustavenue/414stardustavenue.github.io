<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On Stardust Avenue</title>
  <meta name="description" content="On Stardust Avenue offers cosmic, kawaii, and space-inspired merch — from t-shirts to tote bags and more. Unique designs for dreamers, stargazers, and galaxy lovers.">
  <meta name="keywords" content="On Stardust Avenue, 404 Stardust, stardust merch, cosmic apparel, kawaii t-shirts, space tote bags, cute space gifts, space lover merch, TeePublic, Amazon Merch">
  <link rel="canonical" href="https://www.onstardustavenue.com/">

  <!-- Open Graph -->
  <meta property="og:title" content="On Stardust Avenue — Cosmic & Kawaii Merch">
  <meta property="og:description" content="Shop cosmic, kawaii, and galaxy-inspired apparel, tote bags, and more. Perfect gifts for space lovers and dreamers.">
  <meta property="og:image" content="https://onstardustavenue.com/transparent_logo_onstardustavenue.png">
  <meta property="og:url" content="https://www.onstardustavenue.com/">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="On Stardust Avenue — Cosmic & Kawaii Merch">
  <meta name="twitter:description" content="Shop cosmic, kawaii, and galaxy-inspired apparel, tote bags, and more. Perfect gifts for space lovers and dreamers.">
  <meta name="twitter:image" content="https://onstardustavenue.com/transparent_logo_onstardustavenue.png">

  <style>
    body, p, footer, h2 {
      font-family: 'Poppins', sans-serif;
      color: #333;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f7f7f7;
      text-align: center;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 40px 20px;
      background: #ffffff;
      padding-left: 16px;
      padding-right: 16px;
    }
    header img {
      width: 100%;
      max-width: 350px;
      height: auto;
    }
    .shop-section {
      flex: 1;
      padding-left: 16px;
      padding-right: 16px;
    }
    .shop-button {
      display: block;
      width: min(280px, 90vw);
      aspect-ratio: 5 / 2;
      margin: 8px auto;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 1px solid black;
      background-color: transparent;
      transition: transform .3s, background-color .3s;
    }
    @media (hover:hover) {
      .shop-button:hover {
        background-color: #e0e0e0;
        transform: scale(1.05);
      }
    }
    .shop-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 1rem;
      margin-bottom: 20px;
      gap: 8px;
      padding: 8px 0;
      text-align: center;
    }
    .shop-category h3 {
      margin: 15px 0 10px;
    }
    .shopify-button { background-image: url('404_stardust.png'); }
    .teepublic-button { background-image: url('teepublic.png'); }
    .amazonmerch-button { background-image: url('amazonmerch.png'); }
    .contact-section {
      margin: 40px 20px;
      padding-left: 16px;
      padding-right: 16px;
    }
    .contact-section p {
      font-size: 1.2rem;
    }
    h2 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    a {
      color: #333;
      text-decoration: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0.08);
    }
    a:hover { color: #7a7a7a; }
    a:focus-visible,
    .shop-button:focus-visible {
      outline: 3px solid #8ab4f8;
      outline-offset: 3px;
      border-radius: 8px;
    }
    footer {
      padding: 20px 0;
      background: #afafaf;
      color: #afafaf;
    }
    footer a {
      color: #333;
      text-decoration: none;
    }
    .hr1{
      height: 2px;
      border: 0;
      width: min(640px, 92vw);
      margin: 20px auto;
      position: relative;
      display: block;

      background:
              linear-gradient(to right, #f7f7f7, rgba(247,247,247,0)) left / 12% 2px no-repeat,
              linear-gradient(to left,  #f7f7f7, rgba(247,247,247,0)) right / 12% 2px no-repeat,
              linear-gradient(#999, #999) center / 100% 2px no-repeat;
    }

    .hr1::after{
      content: "\2605";
      font-family: Arial, sans-serif;
      position: absolute;
      top: -0.9rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      color: #999;
      text-shadow: 0 0 6px rgba(255,255,255,0.8);
    }
    @media (max-width: 600px) {
      header img { max-width: 280px; }
      h2 { font-size: 1.6rem; margin: 12px 0 16px; }
      .shop-category h3 { font-size: 1.1rem; margin: 10px 0 8px; }
      .contact-section p { font-size: 1rem; }
    }
  </style>
</head>
<body>
<header>
  <a href="http://www.onstardustavenue.com/" target="_blank" rel="noopener">
    <img src="transparent_logo_onstardustavenue.png" alt="On Stardust Avenue logo">
  </a>
</header>

<section class="contact-section">
  <p>For inquiries, custom requests, or feedback, please reach out:<br>
    <a href="mailto:onstardustavenue@gmail.com">onstardustavenue@gmail.com</a>
  </p>
</section>

<hr class="hr1">

<section class="shop-section">
  <h2>Shop Our Designs</h2>

  <div class="shop-category">
    <h3>Main Store:</h3>
    <a href="https://404stardust.com/" target="_blank" rel="noopener" class="shop-link">
      <div class="shop-button shopify-button"></div>
      404 Stardust
    </a>
  </div>

  <hr class="hr1">

  <div class="shop-category">
    <h3>Amazon:</h3>
    <a href="https://www.amazon.com/s/ref=bl_sl_s_ap_web_7141123011?ie=UTF8&node=7141123011&field-brandtextbin=414+Stardust+Avenue" target="_blank" rel="noopener" class="shop-link">
      <div class="shop-button amazonmerch-button"></div>
      414 Stardust Avenue
    </a>
  </div>

  <hr class="hr1">

  <div class="shop-category">
    <h3>TeePublic:</h3>
    <a href="http://tee.pub/lic/SAz-0SZmsZ8" target="_blank" rel="noopener" class="shop-link">
      <div class="shop-button teepublic-button"></div>
      Stardust Avenue
    </a>
  </div>
</section>

<footer>
  <p>&copy; <script>document.write(new Date().getFullYear())</script>
    <a href="http://www.onstardustavenue.com/" target="_blank" rel="noopener">On Stardust Avenue</a>. All Rights Reserved.</p>
</footer>
</body>
</html>
