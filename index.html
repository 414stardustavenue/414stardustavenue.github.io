<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>On Stardust Avenue</title>
    <meta name="description" content="On Stardust Avenue offers cosmic, kawaii, and space-inspired merch — from t-shirts to tote bags and more. Unique designs for dreamers, stargazers, and galaxy lovers.">
    <meta name="keywords" content="On Stardust Avenue, 404 Stardust, stardust merch, cosmic apparel, kawaii t-shirts, space tote bags, cute space gifts, space lover merch, TeePublic, Amazon Merch">
    <link rel="canonical" href="https://www.onstardustavenue.com/">

    <!-- Open Graph -->
    <meta property="og:title" content="On Stardust Avenue — Cosmic & Kawaii Merch">
    <meta property="og:description" content="Shop cosmic, kawaii, and galaxy-inspired apparel, tote bags, and more. Perfect gifts for space lovers and dreamers.">
    <meta property="og:image" content="https://onstardustavenue.com/transparent_logo_onstardustavenue.png">
    <meta property="og:url" content="https://www.onstardustavenue.com/">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="On Stardust Avenue — Cosmic & Kawaii Merch">
    <meta name="twitter:description" content="Shop cosmic, kawaii, and galaxy-inspired apparel, tote bags, and more. Perfect gifts for space lovers and dreamers.">
    <meta name="twitter:image" content="https://onstardustavenue.com/transparent_logo_onstardustavenue.png">

    <style>
        :root{
            --bg:#f7f7f7;
            --text:#333;
            --muted:#555;
            --surface:#fff;
            --line:#d7d7d7;
            --focus:#1d4ed8; 
        }

        *{ box-sizing:border-box; }
        html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
        body, p, footer, h2, h3{
            font-family:'Poppins', sans-serif;
            color:var(--text);
            margin:0;
            padding:0;
        }

        body{
            background-color:var(--bg);
            text-align:center;
            line-height:1.6;
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        /* WCAG: Skip link for keyboard users */
        .skip-link{
            position:absolute;
            left:-999px;
            top:10px;
            background:var(--surface);
            color:var(--text);
            padding:10px 14px;
            border:2px solid var(--focus);
            border-radius:10px;
            z-index:999;
        }
        .skip-link:focus{ left:12px; }

        header{
            padding:40px 16px;
            background:var(--surface);
        }

        header img{
            width:100%;
            max-width:350px;
            height:auto;
            display:block;
            margin:0 auto;
        }
        
        .container{
            width:min(720px, 92vw);
            margin:0 auto;
        }

        .contact-section{
            margin:40px 0;
            padding:0 16px;
        }
        .contact-section p{ font-size:1.2rem; }

        main{
            flex:1;
            padding:0 16px;
        }

        .shop-section{
            padding:0;
        }

        h2{
            font-size:2rem;
            font-weight:600;
            margin-bottom:20px;
        }

        .shop-category h3{
            margin:15px 0 10px;
        }

        a{
            color:var(--text);
            text-decoration:none;
            -webkit-tap-highlight-color:rgba(0,0,0,0.08);
        }
        a:hover{ color:#7a7a7a; }
        
        .shop-list{
            list-style:none;
            margin:0;
            padding:0;
            display:flex;
            flex-direction:column;
            gap:0; 
            align-items:stretch;
        }
        
        .shop-button{
            display:block;
            width:min(280px, 90vw);
            aspect-ratio:5 / 2;
            margin:8px auto;
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            border:1px solid #000;
            background-color:transparent;
            transition:transform .2s ease, background-color .2s ease, box-shadow .2s ease;
            border-radius:12px; 
        }
        
        .shop-link{
            display:flex;
            flex-direction:column;
            align-items:center;
            font-size:1rem;
            margin-bottom:20px;
            gap:8px;
            padding:12px 0; /* larger tap area */
            text-align:center;
            border-radius:12px;
        }

        /* WCAG: clear focus on the link AND on the image-button */
        .shop-link:focus-visible{
            outline:3px solid var(--focus);
            outline-offset:4px;
        }
        .shop-button:focus-visible{
            outline:3px solid var(--focus);
            outline-offset:4px;
        }
        
        @media (hover:hover){
            .shop-link:hover .shop-button{
                background-color:#e0e0e0;
                transform:scale(1.04);
                box-shadow:0 8px 20px rgba(0,0,0,.08);
            }
        }
        .shop-link:active .shop-button{
            transform:scale(0.98);
        }
        
        @media (prefers-reduced-motion: reduce){
            *{ transition:none !important; scroll-behavior:auto !important; }
        }
        
        .sr-only{
            position:absolute !important;
            width:1px; height:1px;
            padding:0; margin:-1px;
            overflow:hidden; clip:rect(0,0,0,0);
            white-space:nowrap; border:0;
        }
        
        .shopify-button{ background-image:url('404_stardust.png'); }
        .teepublic-button{ background-image:url('teepublic.png'); }
        .amazonmerch-button{ background-image:url('amazonmerch.png'); }

        footer{
            padding:20px 0;
            background:#afafaf;
            color:#1f1f1f; 
        }
        footer a{
            color:#1f1f1f;
            text-decoration:none;
        }

        .hr1{
            height:2px;
            border:0;
            width:min(640px, 92vw);
            margin:20px auto;
            position:relative;
            display:block;
            background:
                    linear-gradient(to right, var(--bg), rgba(247,247,247,0)) left / 12% 2px no-repeat,
                    linear-gradient(to left,  var(--bg), rgba(247,247,247,0)) right / 12% 2px no-repeat,
                    linear-gradient(#999, #999) center / 100% 2px no-repeat;
        }
        .hr1::after{
            content:"\2605";
            font-family:Arial, sans-serif;
            position:absolute;
            top:-0.9rem;
            left:50%;
            transform:translateX(-50%);
            font-size:1rem;
            color:#999;
            text-shadow:0 0 6px rgba(255,255,255,0.8);
        }

        @media (max-width: 600px){
            header img{ max-width:280px; }
            h2{ font-size:1.6rem; margin:12px 0 16px; }
            .shop-category h3{ font-size:1.1rem; margin:10px 0 8px; }
            .contact-section p{ font-size:1rem; }
        }
    </style>
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<header>
    <div class="container">
        <a href="http://www.onstardustavenue.com/" target="_blank" rel="noopener">
            <img src="transparent_logo_onstardustavenue.png" alt="On Stardust Avenue logo">
        </a>
    </div>
</header>

<main id="main" class="container">
    <section class="contact-section" aria-label="Contact">
        <p>For inquiries, custom requests, or feedback, please reach out:<br>
            <a href="mailto:onstardustavenue@gmail.com">onstardustavenue@gmail.com</a>
        </p>
    </section>

    <hr class="hr1" aria-hidden="true">

    <section class="shop-section" aria-labelledby="shop-heading">
        <h2 id="shop-heading">Shop Our Designs</h2>

        <ul class="shop-list">
            <li class="shop-category">
                <h3>Main Store:</h3>
                <a href="https://404stardust.com/" target="_blank" rel="noopener" class="shop-link"
                   aria-label="Main Store: 404 Stardust (opens in a new tab)">
                    <!-- Screen reader gets a real image label -->
                    <img class="sr-only" src="404_stardust.png" alt="404 Stardust store logo">
                    <div class="shop-button shopify-button" role="img" aria-label="404 Stardust store button"></div>
                    404 Stardust
                </a>
            </li>

            <hr class="hr1" aria-hidden="true">

            <li class="shop-category">
                <h3>Amazon:</h3>
                <a href="https://www.amazon.com/s?rh=n%3A7141123011%2Cp_4%3A404%2BStardust&ref=bl_sl_s_ap_web_7141123011"
                   target="_blank" rel="noopener" class="shop-link"
                   aria-label="Amazon: 414 Stardust Avenue (opens in a new tab)">
                    <img class="sr-only" src="amazonmerch.png" alt="Amazon Merch logo">
                    <div class="shop-button amazonmerch-button" role="img" aria-label="Amazon store button"></div>
                    414 Stardust Avenue
                </a>
            </li>

            <hr class="hr1" aria-hidden="true">

            <li class="shop-category">
                <h3>TeePublic:</h3>
                <a href="http://tee.pub/lic/SAz-0SZmsZ8" target="_blank" rel="noopener" class="shop-link"
                   aria-label="TeePublic: Stardust Avenue (opens in a new tab)">
                    <img class="sr-only" src="teepublic.png" alt="TeePublic logo">
                    <div class="shop-button teepublic-button" role="img" aria-label="TeePublic store button"></div>
                    Stardust Avenue
                </a>
            </li>
        </ul>
    </section>
</main>

<footer>
    <p>&copy; <script>document.write(new Date().getFullYear())</script>
        <a href="http://www.onstardustavenue.com/" target="_blank" rel="noopener">On Stardust Avenue</a>. All Rights Reserved.</p>
</footer>
</body>
</html>
